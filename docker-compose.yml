# Ollama + Sheru's backend (his brain). aw-server (ActivityWatch) runs on the host, not in a container.
# Sheru's desktop app and the browser extension run on the host and talk to http://localhost:8000.
# The "sheru" persona model is not created here; the backend falls back to LLM_MODEL with the same persona prompt.
# aw-server must listen on an address reachable from the container (not 127.0.0.1 only),
# e.g. set address = "0.0.0.0" in aw-server-rust config.toml. Otherwise, with DATA_SOURCE=auto,
# the backend logs a warning and serves built-in sample data (source: "sample").
services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=chrome-extension://*
    restart: unless-stopped

  pulse-backend:
    build: ./pulse-backend
    ports:
      - "8000:8000"
    environment:
      - AW_SERVER_URL=http://host.docker.internal:5600
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-qwen3.5:4b}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
      - AW_BUCKET_PREFIX=${AW_BUCKET_PREFIX:-aw-watcher-web-lighthouse}
      - DATA_SOURCE=${DATA_SOURCE:-auto}
      - STANDUP_FALLBACK=${STANDUP_FALLBACK:-template}
      - SHERU_DATA_DIR=/data
      - LLM_CLASSIFY=${LLM_CLASSIFY:-on}
    volumes:
      - sheru_data:/data                 # profile.json + sheru.db survive container restarts
      - ./buddy/web:/buddy/web:ro        # Sheru's UI, served at /buddy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  sheru_data:
