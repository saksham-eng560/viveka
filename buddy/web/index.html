<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leo</title>
  <meta name="description" content="Leo, your lion-cub focus buddy">
  <link rel="icon" href="leo.svg">
  <link rel="stylesheet" href="buddy.css">
</head>
<body>
  <div id="stage">
    <div id="leo-wrap" aria-label="Leo: click for a menu, drag to move">
      <div id="leo" aria-hidden="true"></div>
      <div id="status-chip" hidden></div>
    </div>
    <section id="bubble" role="status" aria-live="polite" hidden>
      <button id="bubble-close" type="button" aria-label="Close">×</button>
      <p id="bubble-title"></p>
      <p id="bubble-text"></p>
      <p id="bubble-source"></p>
      <div id="bubble-actions"></div>
      <form id="chat-form" hidden autocomplete="off">
        <input id="chat-input" type="text" maxlength="400" placeholder="Ask Leo anything…" aria-label="Message Leo">
        <button type="submit" aria-label="Send">➤</button>
      </form>
      <div id="bubble-timer"></div>
    </section>
  </div>
  <noscript>Leo needs JavaScript.</noscript>
  <script src="buddy.js"></script>
</body>
</html>
