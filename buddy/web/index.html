<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheru</title>
  <meta name="description" content="Sheru, your Lighthouse desk buddy">
  <link rel="icon" href="sheru.svg">
  <link rel="stylesheet" href="buddy.css">
</head>
<body>
  <div id="stage">
    <div id="sheru-wrap" title="Sheru — click me, or drag me around">
      <div id="sheru" aria-hidden="true"></div>
      <div id="status-chip" hidden></div>
    </div>
    <section id="bubble" role="status" aria-live="polite" hidden>
      <button id="bubble-close" type="button" aria-label="Close">×</button>
      <p id="bubble-title"></p>
      <p id="bubble-text"></p>
      <p id="bubble-source"></p>
      <div id="bubble-actions"></div>
      <form id="chat-form" hidden autocomplete="off">
        <input id="chat-input" type="text" maxlength="400" placeholder="Ask Sheru anything…" aria-label="Message Sheru">
        <button type="submit" aria-label="Send">➤</button>
      </form>
      <div id="bubble-timer"></div>
    </section>
  </div>
  <noscript>Sheru needs JavaScript.</noscript>
  <script src="buddy.js"></script>
</body>
</html>
